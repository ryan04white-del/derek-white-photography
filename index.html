function titleFor(p){return categories[p.cat].name+' · '+String(p.id).padStart(3,'0')}
function photoMarkup(p,selected=false,title=''){return `<figure class="${selected?'selected-photo':'photo'}"><button data-photo="${p.id}" aria-label="View ${title||titleFor(p)}"><img src="${path(p.id)}" alt="${title||titleFor(p)} by Derek White" width="${p.w}" height="${p.h}" loading="lazy"></button><figcaption>${title||titleFor(p)}</figcaption></figure>`}
function wirePhotos(list){main.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{currentPhotos=list;currentIndex=list.findIndex(x=>x.id===+b.dataset.photo);openPhoto()})}
function openPhoto(){let p=currentPhotos[currentIndex];$('#viewerImage').src=path(p.id);$('#viewerImage').alt=titleFor(p)+' by Derek White';$('#viewerCaption').textContent=titleFor(p)+' · Derek White';$('#modalCount').textContent=(currentIndex+1)+' / '+currentPhotos.length;if(!$('#viewer').open)$('#viewer').showModal()}
$('#prevImage').onclick=()=>{currentIndex=(currentIndex-1+currentPhotos.length)%currentPhotos.length;openPhoto()};$('#nextImage').onclick=()=>{currentIndex=(currentIndex+1)%currentPhotos.length;openPhoto()};$('#closeViewer').onclick=()=>$('#viewer').close();$('#viewer').onclick=e=>{if(e.target===$('#viewer'))$('#viewer').close()};$('#viewer').addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('#nextImage').click();if(e.key==='ArrowLeft')$('#prevImage').click()});
function home(){let ids=[109,8,119,79,65,279],titles=['Last light on the cliffs','Where mountains meet water','The winding way','A world in green','A quiet encounter','Along the canal'];let list=ids.map(byId);main.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow" style="color:#ddd">Photography by Derek White</div><h1><small>Go to the</small><span>Mountain.</span></h1><p>Wild places, quiet moments, and the adventures worth remembering.</p><a class="button solid" href="#gallery">Explore the collection <span>↗</span></a></div></section><section class="wrap"><div class="section-heading"><div><div class="eyebrow">A few favorites</div><h2>Worth stopping <em>for.</em></h2></div><p class="subtle">A small selection from Derek’s world. Follow a photograph, or find your own path through the collection.</p></div><div class="selected">${list.map((p,i)=>photoMarkup(p,true,titles[i])).join('')}</div><div class="home-doors"><a class="door" href="#gallery"><div class="eyebrow">The full collection ↗</div><strong>Find your kind of wonder.</strong><p>Browse seven collections, from landscapes to everyday life.</p></a><a class="door" href="#lab"><div class="eyebrow">Learn by doing ↗</div><strong>Get behind the camera.</strong><p>Press the buttons. Change the light. Make a practice photograph.</p></a></div></section>`;wirePhotos(list)}
function gallery(){main.innerHTML=`<section class="wrap"><div class="page-head"><div class="eyebrow">The collection · ${catalog.length} photographs</div><h1 class="page-title">Choose a path.</h1><p>Seven collections. A world of stories. Open an album to explore without scrolling through everything at once.</p></div><div class="album-grid">${Object.entries(categories).map(([key,c])=>`<a class="album" href="#gallery/${key}"><img src="${path(c.cover)}" alt="${c.name}" loading="lazy" width="800" height="600"><div class="cover-text"><small>${catalog.filter(p=>p.cat===key).length} photographs</small><strong>${c.name}</strong></div></a>`).join('')}</div></section>`}
function album(cat,p=1){if(!categories[cat]){location.hash='gallery';return}let list=catalog.filter(x=>x.cat===cat),pages=Math.ceil(list.length/perPage);page=Math.max(1,Math.min(pages,p));let c=categories[cat],shown=list.slice((page-1)*perPage,page*perPage);main.innerHTML=`<section class="wrap"><a class="crumb" href="#gallery">← All collections</a><div class="section-heading"><div><div class="eyebrow">${list.length} photographs · Derek White</div><h1 class="page-title">${c.name}</h1><p class="subtle">${c.description}</p></div></div><div class="album-nav" aria-label="Gallery collections">${Object.entries(categories).map(([key,c])=>`<a class="chip ${key===cat?'active':''}" href="#gallery/${key}" ${key===cat?'aria-current="page"':''}>${c.name}</a>`).join('')}</div><div class="gallery-grid">${shown.map(p=>photoMarkup(p)).join('')}</div><div class="pagination"><button class="button" id="previousPage" ${page===1?'disabled':''}>← Previous</button><span>${page} / ${pages}</span><button class="button" id="nextPage" ${page===pages?'disabled':''}>Next →</button></div></section>`;wirePhotos(list);$('#previousPage').onclick=()=>{album(cat,page-1);window.scrollTo(0,0)};$('#nextPage').onclick=()=>{album(cat,page+1);window.scrollTo(0,0)}}
function about(){main.innerHTML=`<section class="wrap about-grid"><img class="portrait" src="786453994_10239758981370147_2350902580469777487_n.jpg" alt="Derek White smiling with mountains behind him"><div><div class="eyebrow">Meet the photographer</div><h1 class="page-title">Behind the <em>lens.</em></h1><p class="subtle">Derek White finds inspiration in the outdoors, the people he shares it with, and the places that invite us to slow down. Go to the Mountain brings together those moments and adventures.</p><div class="links"><a href="https://www.youtube.com/@wheelswest" target="_blank" rel="noopener">Wheels West <span>↗</span></a><a href="https://www.youtube.com/@domwhite66" target="_blank" rel="noopener">Dom White 66 <span>↗</span></a><a href="https://www.facebook.com/derek.white.182/videos/1436505140510987/" target="_blank" rel="noopener">Be Still <span>↗</span></a></div><p class="subtle" style="font-size:12px">Films, rides, and stories beyond the frame.</p></div></section>`}

const tips={menu:['MENU · explore the camera','Open the settings menu on the rear screen. Use the arrow buttons to choose a row, then press OK or the right arrow to cycle its value. Press MENU again to return to the live view.'],fn:['Fn / i · your quick settings','A quick menu keeps common settings close at hand. Click a tile to cycle white balance, focus mode, drive mode or picture style. Fn is a common Sony label; Nikon often uses an i menu.'],shutter:['Shutter · make a practice photograph','The shutter records this simulated preview, including your exposure and picture style. Try the two-second timer or a three-frame practice burst in MENU. Your practice shots stay in this tab until you reload.'],focus:['AF-ON · focus before the shot','Pressing AF-ON engages autofocus. A green box confirms focus in this illustration. AF-S locks for a still subject, AF-C is used for moving subjects, and MF leaves focus to the photographer.'],ael:['AEL · hold the exposure','In the automatic exposure modes, this practice control holds the current preview brightness while you change settings. In Manual, you set the exposure yourself; the exposure lock has no effect here.'],display:['DISP · choose what you see','Cycle between a composition grid, a brightness histogram and a clean preview. The histogram shows the tones in this simulated image: shadows left, highlights right.'],playback:['Playback · review your photographs','Open the last practice shot on the camera screen. Use the left and right arrows to review the session, or click a thumbnail below the camera. Press Playback again to return to shooting.'],aperture:['Aperture · the lens opening','Turn the command dial to change the f-number. A wider opening gathers more light; a narrower opening can bring more of the scene into focus. A finished photo cannot recover real depth information, so this tool illustrates exposure rather than recreating depth of field.'],shutterSpeed:['Shutter speed · time and motion','The command dial changes how long the sensor gathers light. Faster speeds help freeze action; slower speeds gather more light. The softening at slow speeds is an illustration, not a recreation of the movement in Derek’s original scene.'],iso:['ISO · amplification and noise','The command dial raises or lowers ISO. Higher ISO brightens the simulated preview and adds visible grain. In a camera, noise also depends on the sensor and how much light was captured.'],mode:['Mode dial · decide who sets what','M lets you choose aperture and shutter speed. A keeps your aperture choice and sets a balancing shutter speed. S keeps your shutter choice and sets a balancing aperture. P balances both. These are simplified teaching calculations, not a light-meter reading.']};

function cameraLab(){renderVersion++;main.innerHTML=`<section class="lab-header"><div><div class="eyebrow">The camera workshop</div><h1 class="page-title">Press. Explore. <em>Learn.</em></h1></div><p>A camera you can experiment with. Start with <strong>MENU</strong> or <strong>Fn</strong>, turn a dial, then press the shutter.</p></section><section class="workbench"><div><div class="lab-toolbar"><span class="eyebrow">Interactive rear-screen simulator</span><button class="chip" id="switchBrand">${cam.brand==='sony'?'Sony-inspired':'Nikon-inspired'} · switch labels</button></div><div class="camera"><div class="camera-top"><div class="camera-name" id="cameraName">FIELD / ${cam.brand==='sony'?'α':'Z'}<small>LEARNING CAMERA</small></div><div class="mode-dial" aria-label="Camera exposure mode">${['P','A','S','M'].map(m=>`<button data-mode="${m}" aria-label="${m} exposure mode" aria-pressed="${m===cam.mode}">${m}</button>`).join('')}</div><button class="shutter" id="shutterButton" aria-label="Press shutter">SHUTTER ◉</button></div><div class="top-buttons"><button class="camera-btn" id="menuButton">MENU</button><button class="camera-btn" id="aelButton">AE-L</button></div><div class="rear"><div class="lcd" id="lcd"><canvas id="preview" width="900" height="600" aria-label="Camera preview with simulated settings"></canvas><div class="frame-lines" id="gridlines"></div><div class="focus-box" id="focusBox"></div><div class="readout" id="readout"><span id="lcdTop"></span><span class="bottom" id="lcdBottom"></span></div><div id="lcdPanel" class="lcd-panel" hidden></div></div><div class="side-buttons"><button class="camera-btn" id="afButton">AF-ON</button><button class="camera-btn" id="fnButton">${cam.brand==='sony'?'Fn':'i'}</button><div class="wheel" aria-label="Camera navigation control"><button id="wheelUp" aria-label="Camera up">▲</button><button id="wheelLeft" aria-label="Camera left">◀</button><button id="wheelOk" aria-label="Camera OK">OK</button><button id="wheelRight" aria-label="Camera right">▶</button><button id="wheelDown" aria-label="Camera down">▼</button></div><button class="camera-btn" id="dispButton">DISP</button><button class="camera-btn" id="playButton" aria-label="Camera playback">▶ REVIEW</button></div></div><div class="command"><span class="command-label" id="dialLabel">COMMAND DIAL · APERTURE</span><div class="command-buttons"><button class="camera-btn" id="dialMinus" aria-label="Turn command dial left">−</button><button class="camera-btn" id="dialPlus" aria-label="Turn command dial right">+</button></div></div><div class="camera-foot"><label>SCENE <select id="sceneSelect" aria-label="Camera practice scene"><option value="67">Teton reflection</option><option value="65">Wildlife in the meadow</option><option value="88">On the wave</option><option value="59">Below the surface</option></select></label><button class="camera-btn" id="resetCamera">RESET CAMERA</button></div></div><p class="sim-note">Inspired by common mirrorless camera controls, with a simplified teaching layout. Effects are simulated on Derek’s existing photographs; this is not an emulator of a specific Sony or Nikon model.</p><div class="shots"><div class="eyebrow">Your practice roll <span id="shotCount"></span></div><div class="shot-strip" id="shotStrip"></div><div class="capture-message" id="captureMessage" role="status" aria-live="polite"></div></div></div><aside class="instruction"><div><div class="eyebrow">What does this button do?</div><h2 id="helpTitle">Start with the buttons.</h2><p id="helpText">Press MENU to explore camera settings, Fn for quick controls, or AF-ON to focus. The explanation here follows the control you use.</p><div class="setting-summary"><div><span>Aperture</span><b id="sumA"></b></div><div><span>Shutter</span><b id="sumS"></b></div><div><span>ISO</span><b id="sumI"></b></div></div><p id="exposureNote"></p><p class="lab-note">Try a challenge: switch to S, choose a fast shutter for the wave, focus, and take a shot. Then compare it with a slower shutter.</p></div><div class="settings-side"><div class="eyebrow" style="margin-bottom:12px">Turn the command dial</div><div id="settingTabs" class="album-nav" style="margin:8px 0 18px">${settingNames.map(k=>`<button class="chip" data-setting="${k}">${k==='ev'?'± EV':settingsLabel[k]}</button>`).join('')}</div><div class="control-row"><label for="apertureRange">Aperture <output id="aOutput"></output></label><input id="apertureRange" type="range" min="0" max="6" step="1" value="${cam.a}"></div><div class="control-row"><label for="shutterRange">Shutter speed <output id="sOutput"></output></label><input id="shutterRange" type="range" min="0" max="6" step="1" value="${cam.s}"></div><div class="control-row"><label for="isoRange">ISO <output id="iOutput"></output></label><input id="isoRange" type="range" min="0" max="6" step="1" value="${cam.i}"></div><div class="control-row"><label for="evRange">Exposure compensation <output id="evOutput"></output></label><input id="evRange" type="range" min="-2" max="2" step=".5" value="${cam.ev}"></div><p class="lab-note">A, S and P adjust the other exposure settings in this illustration. Compensation is available in those modes. In M, use aperture, shutter and ISO directly.</p></div></aside></section>`;
$('#sceneSelect').value=cam.scene;main.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{cam.mode=b.dataset.mode;cam.ael=false;balance();teach('mode');updateCamera()});main.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>selectSetting(b.dataset.setting));$('#switchBrand').onclick=()=>{cam.brand=cam.brand==='sony'?'nikon':'sony';cameraLab();teach('fn')};$('#menuButton').onclick=()=>{cam.panel=cam.panel==='menu'?'':'menu';cam.row=0;teach('menu');panel()};$('#fnButton').onclick=()=>{cam.panel=cam.panel==='fn'?'':'fn';teach('fn');panel()};$('#afButton').onclick=()=>{cam.focused=!cam.focused;teach('focus');updateCamera()};$('#aelButton').onclick=()=>{cam.lockedEV=rawEV();cam.ael=!cam.ael;teach('ael');updateCamera()};$('#dispButton').onclick=()=>{cam.display=(cam.display+1)%3;teach('display');updateCamera()};$('#shutterButton').onclick=shoot;$('#playButton').onclick=()=>{cam.panel=cam.panel==='playback'?'':'playback';if(shots.length)reviewIndex=shots.length-1;teach('playback');panel()};$('#wheelUp').onclick=()=>navigate(-1);$('#wheelDown').onclick=()=>navigate(1);$('#wheelLeft').onclick=()=>turn(-1);$('#wheelRight').onclick=()=>turn(1);$('#wheelOk').onclick=()=>{if(cam.panel==='menu')cycleMenu();else if(cam.panel==='playback'){cam.panel='';panel()}else{cam.focused=true;teach('focus');updateCamera()}};$('#dialMinus').onclick=()=>turn(-1);$('#dialPlus').onclick=()=>turn(1);$('#sceneSelect').onchange=e=>{cam.scene=+e.target.value;cam.focused=false;cam.ael=false;loadScene()};$('#resetCamera').onclick=()=>{let brand=cam.brand,scene=cam.scene;cam={brand,scene,mode:'M',a:2,s:3,i:1,ev:0,wb:'Daylight',focus:'AF-S',drive:'Single',look:'Color',display:0,active:'aperture',panel:'',row:0,focused:false,ael:false,lockedEV:0};cameraLab()};[['#apertureRange','a','aperture'],['#shutterRange','s','shutter'],['#isoRange','i','iso'],['#evRange','ev','ev']].forEach(([id,key,active])=>$(id).oninput=e=>{cam[key]=+e.target.value;cam.active=active;balance();teach(active==='shutter'?'shutterSpeed':active==='ev'?'mode':active);updateCamera()});renderShots();loadScene();selectSetting(cam.active,false);}
function rawEV(){return Math.log2((4/apertureValues[cam.a])**2*(250/shutterValues[cam.s])*(isoValues[cam.i]/200))+(cam.mode==='M'?0:cam.ev)}
function nearest(v,arr){return arr.reduce((best,x,i)=>Math.abs(Math.log2(x/v))<Math.abs(Math.log2(arr[best]/v))?i:best,0)}
function balance(){if(cam.mode==='A')cam.s=nearest(250*(4/apertureValues[cam.a])**2*(isoValues[cam.i]/200),shutterValues);if(cam.mode==='S')cam.a=nearest(4*Math.sqrt((250/shutterValues[cam.s])*(isoValues[cam.i]/200)),apertureValues);if(cam.mode==='P'){cam.a=2;cam.s=nearest(250*(isoValues[cam.i]/200),shutterValues)}}
function selectSetting(k,explain=true){cam.active=k;if(explain)teach(k==='shutter'?'shutterSpeed':k==='ev'?'mode':k);updateCamera()}
function navigate(d){if(cam.panel==='menu'){cam.row=(cam.row+d+menuItems.length)%menuItems.length;panel()}else if(cam.panel==='playback'){if(shots.length)reviewIndex=(reviewIndex+d+shots.length)%shots.length;panel()}else{cam.active=settingNames[(settingNames.indexOf(cam.active)+d+settingNames.length)%settingNames.length];selectSetting(cam.active)}}
function turn(d){if(cam.panel==='menu'){cycleMenu(d);return}if(cam.panel==='playback'){navigate(d);return}if(cam.active==='aperture'&&(cam.mode==='S'||cam.mode==='P')){teach('mode');return}if(cam.active==='shutter'&&(cam.mode==='A'||cam.mode==='P')){teach('mode');return}if(cam.active==='ev'&&cam.mode==='M'){teach('mode');return}let k={aperture:'a',shutter:'s',iso:'i',ev:'ev'}[cam.active],step=k==='ev'?.5:1;cam[k]=Math.max(k==='ev'?-2:0,Math.min(k==='ev'?2:6,cam[k]+d*step));balance();selectSetting(cam.active)}
function loadScene(){let token=++imageToken;sourceImage=null;let img=new Image();img.onload=()=>{if(token!==imageToken||!$('#preview'))return;sourceImage=img;updateCamera()};img.onerror=()=>{if($('#captureMessage'))$('#captureMessage').textContent='This practice image could not load. Please choose another scene.'};img.src=path(cam.scene);updateCamera()}
function updateCamera(){if(!$('#preview'))return;$('#sumA').textContent=$('#aOutput').value='f/'+apertureValues[cam.a];$('#sumS').textContent=$('#sOutput').value='1/'+shutterValues[cam.s];$('#sumI').textContent=$('#iOutput').value=isoValues[cam.i];$('#evOutput').value=(cam.ev>0?'+':'')+cam.ev+' EV';$('#apertureRange').value=cam.a;$('#shutterRange').value=cam.s;$('#isoRange').value=cam.i;$('#evRange').value=cam.ev;$('#apertureRange').disabled=['S','P'].includes(cam.mode);$('#shutterRange').disabled=['A','P'].includes(cam.mode);$('#evRange').disabled=cam.mode==='M';main.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===cam.mode)));main.querySelectorAll('[data-setting]').forEach(b=>b.classList.toggle('active',b.dataset.setting===cam.active));$('#dialLabel').textContent='COMMAND DIAL · '+settingsLabel[cam.active].toUpperCase();$('#gridlines').hidden=cam.display!==0;$('#focusBox').hidden=cam.display===2;$('#focusBox').classList.toggle('locked',cam.focused);$('#aelButton').classList.toggle('on',cam.ael&&cam.mode!=='M');$('#afButton').classList.toggle('on',cam.focused);$('#lcdTop').textContent=cam.mode+'   '+cam.focus+'   '+(cam.focused?'FOCUS ✓':'◇')+'   '+(cam.ael&&cam.mode!=='M'?'AE-L':'')+'   '+cam.wb;$('#lcdBottom').innerHTML='<span>1/'+shutterValues[cam.s]+'  f/'+apertureValues[cam.a]+'</span><span>ISO '+isoValues[cam.i]+'</span>';$('#readout').hidden=cam.display===2;let ev=cam.ael&&cam.mode!=='M'?cam.lockedEV:rawEV();$('#exposureNote').textContent=ev>1?'The simulated exposure is bright. Reduce ISO or use less light.':ev< -1?'The simulated exposure is dark. Increase ISO or gather more light.':'The simulated exposure is near its starting brightness.';drawPreview();panel()}
function drawPreview(overlays=true){let cv=$('#preview');if(!cv)return;let ctx=cv.getContext('2d');ctx.fillStyle='#060606';ctx.fillRect(0,0,900,600);if(!sourceImage)return;let ev=cam.ael&&cam.mode!=='M'?cam.lockedEV:rawEV();let bright=Math.max(.13,Math.min(3.5,2**(ev*.48))),blur=cam.s===0?1.3:0;ctx.filter=`brightness(${bright}) ${cam.look==='Monochrome'?'grayscale(1)':cam.look==='High contrast'?'contrast(1.35) saturate(.85)':''} ${blur?'blur('+blur+'px)':''}`;let ratio=Math.min(900/sourceImage.width,600/sourceImage.height),w=sourceImage.width*ratio,h=sourceImage.height*ratio,x=(900-w)/2,y=(600-h)/2;ctx.drawImage(sourceImage,x,y,w,h);ctx.filter='none';if(cam.wb!=='Daylight'){ctx.globalCompositeOperation='source-atop';ctx.fillStyle=cam.wb==='Cloudy'?'rgba(255,147,50,.12)':'rgba(80,135,255,.16)';ctx.fillRect(x,y,w,h);ctx.globalCompositeOperation='source-over'}if(cam.i>2){let pix=ctx.getImageData(0,0,900,600),d=pix.data,amp=(cam.i-2)*7;for(let yy=Math.ceil(y);yy<y+h;yy++)for(let xx=Math.ceil(x);xx<x+w;xx++){let j=(yy*900+xx)*4;let noise=(Math.random()-.5)*amp;d[j]+=noise;d[j+1]+=noise;d[j+2]+=noise}ctx.putImageData(pix,0,0)}if(cam.display===1&&overlays){let data=ctx.getImageData(0,0,900,600).data,bins=new Array(40).fill(0);for(let j=0;j<data.length;j+=40){let lum=(data[j]*.2126+data[j+1]*.7152+data[j+2]*.0722);bins[Math.min(39,Math.floor(lum/256*40))]++}let peak=Math.max(...bins);ctx.fillStyle='#000a';ctx.fillRect(650,440,225,120);ctx.fillStyle='#eee';bins.forEach((n,i)=>ctx.fillRect(660+i*5,550-n/peak*95,4,n/peak*95))}}
const menuItems=[['White balance','wb'],['Focus mode','focus'],['Drive mode','drive'],['Picture style','look'],['Display overlays','display']];function cycleOption(key,d=1){if(key==='display')cam.display=(cam.display+d+3)%3;else cam[key]=choices[key][(choices[key].indexOf(cam[key])+d+choices[key].length)%choices[key].length];if(key==='focus')cam.focused=false;updateCamera()}
function cycleMenu(d=1){cycleOption(menuItems[cam.row][1],d)}let reviewIndex=0;
function panel(){let p=$('#lcdPanel');if(!p)return;p.hidden=!cam.panel;if(!cam.panel){p.innerHTML='';return}if(cam.panel==='menu'){p.innerHTML='<h3>Camera menu · ↑ ↓ / OK</h3>'+menuItems.map(([name,key],i)=>`<button class="menu-row ${i===cam.row?'selected':''}" data-menu="${i}"><span>${name}</span><b>${key==='display'?['Grid','Histogram','Clean'][cam.display]:cam[key]}</b></button>`).join('');p.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{cam.row=+b.dataset.menu;cycleMenu()})}else if(cam.panel==='fn'){p.innerHTML='<h3>Quick settings · click to change</h3><div class="fn-grid">'+['wb','focus','drive','look'].map(key=>`<button data-quick="${key}">${{wb:'WHITE BALANCE',focus:'FOCUS',drive:'DRIVE',look:'PICTURE STYLE'}[key]}<b>${cam[key]}</b></button>`).join('')+'<button data-quick="display">DISPLAY<b>'+['Grid','Histogram','Clean'][cam.display]+'</b></button><button id="closeQuick">RETURN<b>LIVE VIEW ↩</b></button></div>';p.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>cycleOption(b.dataset.quick));p.querySelector('#closeQuick').onclick=()=>{cam.panel='';panel()}}else if(cam.panel==='playback'){if(!shots.length){p.innerHTML='<h3>Playback</h3><p>No practice photographs yet.</p><p>Press SHUTTER to make your first shot.</p>';return}let s=shots[reviewIndex];p.innerHTML='<h3>Playback · '+(reviewIndex+1)+' / '+shots.length+'</h3><img src="'+s.url+'" alt="Your practice photograph"><div style="font:9px monospace">'+s.settings+'</div>'}}
function shoot(){teach('shutter');if(busy||!sourceImage){$('#captureMessage').textContent='Please wait for the preview to load.';return}busy=true;cam.panel='';panel();let version=renderVersion;function capture(final=true){if(version!==renderVersion||!$('#preview')){busy=false;return}drawPreview(false);let cv=$('#preview');let settings=cam.mode+' · f/'+apertureValues[cam.a]+' · 1/'+shutterValues[cam.s]+'s · ISO '+isoValues[cam.i];let shot={url:cv.toDataURL('image/jpeg',.87),settings};shots.push(shot);if(shots.length>24)shots.shift();let el=document.createElement('div');el.className='blackout';$('#lcd').append(el);setTimeout(()=>el.remove(),400);$('#captureMessage').textContent='Captured · '+settings;renderShots();drawPreview();busy=!final}if(cam.drive==='2s timer'){$('#captureMessage').textContent='Self-timer · 2 seconds…';setTimeout(capture,2000)}else if(cam.drive==='Burst ×3'){capture(false);setTimeout(()=>capture(false),250);setTimeout(()=>capture(true),500)}else capture()}
function renderShots(){if(!$('#shotStrip'))return;$('#shotCount').textContent='· '+shots.length+' / 24';$('#shotStrip').innerHTML=shots.length?shots.map((s,i)=>`<button data-shot="${i}" aria-label="Review practice shot ${i+1}"><img src="${s.url}" alt="Practice shot ${i+1}"><small>FRAME ${String(i+1).padStart(2,'0')}</small></button>`).join(''):'<p class="shot-empty">Your photographs will appear here. Press the shutter to start.</p>';$('#shotStrip').querySelectorAll('[data-shot]').forEach(b=>b.onclick=()=>{reviewIndex=+b.dataset.shot;cam.panel='playback';panel();teach('playback')})}
function route(){busy=false;imageToken++;let parts=(location.hash.slice(1)||'home').split('/'),view=parts[0];if($('#viewer').open)$('#viewer').close();document.querySelectorAll('[data-nav]').forEach(a=>a.setAttribute('aria-current',a.dataset.nav===view?'page':'false'));if(view==='gallery'&&parts[1])album(parts[1]);else if(view==='gallery')gallery();else if(view==='lab'||view==='camera-lab')cameraLab();else if(view==='about'||view==='story'||view==='adventures')about();else home();window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
</script></body></html>
